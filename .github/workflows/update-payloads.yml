name: Update PS5 payload releases

on:
  schedule:
    - cron: '23 * * * *' # Hourly at :23 UTC; GitHub scheduling can be delayed.
  workflow_dispatch:
  push:
    paths:
      - 'update_payloads.py'
      - '.github/workflows/update-payloads.yml'

permissions:
  contents: write

concurrency:
  group: update-ps5-payloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh official releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python update_payloads.py

      - name: Commit changes when new releases appear
        run: |
          if git diff --quiet -- payloads.json; then
            echo "No release changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payloads.json
          git commit -m 'chore: refresh PS5 payload release catalog'
          git push
